# Font configuration
font_family      family="monospace"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Line height and spacing (Resetting to defaults)
adjust_line_height  0
adjust_column_width 0
disable_ligatures   never

# Performance settings for NVIDIA/Wayland
repaint_delay    10
input_delay      3
sync_to_monitor  yes
